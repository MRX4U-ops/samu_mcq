name: Deploy to GitHub Pages

on:
  push:
    branches: [ Main-Branch, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: student-web/package-lock.json

      - name: Install dependencies
        run: |
          cd student-web
          npm ci

      - name: Build student-web (includes bundled admin-panel)
        run: |
          cd student-web
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: student-web/dist
          branch: gh-pages
