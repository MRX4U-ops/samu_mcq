name: Deploy to GitHub Pages

on:
  push:
    branches: [ Main-Branch, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: student-web/package-lock.json

      - name: Build admin-panel
        env:
          VITE_SUPABASE_URL: https://kzvixaayzqgkdftfpdsi.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_MrxugWrfei7zCHAPkr4KaA_ChQFj6mk
          VITE_SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6dml4YWF5enFna2RmdGZwZHNpIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NzY1MTkxNywiZXhwIjoyMDkzMjI3OTE3fQ.cJ5q789e5ODGM18nQ3ZLVPt9ckQtnNhQ613B-dAU3iY
          VITE_API_BASE_URL: https://samu-mcqs.onrender.com/api
        run: |
          cd admin-panel
          npm ci
          npm run build
          cd ..
          rm -rf student-web/public/admin
          cp -r admin-panel/dist student-web/public/admin

      - name: Build student-web
        run: |
          cd student-web
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: student-web/dist
          branch: gh-pages
