  <!-- Supabase Service Role integration for real admin data -->
  <script>
    const SUPABASE_URL = 'https://kzvixaayzqgkdftfpdsi.supabase.co';
    const SUPABASE_SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6dml4YWF5enFna2RmdGZwZHNpIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NzY1MTkxNywiZXhwIjoyMDkzMjI3OTE3fQ.cJ5q789e5ODGM18nQ3ZLVPt9ckQtnNhQ613B-dAU3iY';
    
    async function sbQuery(table, params) {
      try {
        const url = SUPABASE_URL + '/rest/v1/' + table + '?' + (params || 'limit=500&select=*');
        const res = await fetch(url, {
          headers: {
            'apikey': SUPABASE_SERVICE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_SERVICE_KEY
          }
        });
        const data = await res.json();
        return Array.isArray(data) ? data : [];
      } catch(e) { console.error('sbQuery error:', e); return []; }
    }
    
    async function sbAuthUsers() {
      try {
        const res = await fetch(SUPABASE_URL + '/auth/v1/admin/users?per_page=500', {
          headers: { 'apikey': SUPABASE_SERVICE_KEY, 'Authorization': 'Bearer ' + SUPABASE_SERVICE_KEY }
        });
        const d = await res.json();
        return d.users || [];
      } catch(e) { return []; }
    }
    
    async function sbPatch(table, id, updates) {
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/' + table + '?id=eq.' + id, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_SERVICE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_SERVICE_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify(updates)
        });
        return await res.json();
      } catch(e) { return null; }
    }
    
    async function sbInsert(table, data) {
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/' + table, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_SERVICE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_SERVICE_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        return Array.isArray(result) ? result[0] : result;
      } catch(e) { console.error('sbInsert error:', e); return null; }
    }
    
    async function sbDelete(table, id) {
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/' + table + '?id=eq.' + id, {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_SERVICE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_SERVICE_KEY
          }
        });
        return res.ok;
      } catch(e) { return false; }
    }
    
    // Load real data from Supabase
    window.loadRealDataFromSupabase = async function() {
      console.log('🔄 Syncing ALL real data from Supabase live database...');
      const syncBtn = document.getElementById('btnSyncData');
      if (syncBtn) { syncBtn.innerHTML = '⏳ Syncing...'; syncBtn.disabled = true; }
      
      try {
        // Parallel fetch all real data from Supabase
        const [profiles, subscriptions, payments, promoCodes, badges, supportTickets, courses, subjects, topics, attempts] = await Promise.all([
          sbQuery('profiles', 'limit=500&order=created_at.desc&select=*'),
          sbQuery('subscriptions', 'limit=500&order=created_at.desc&select=*'),
          sbQuery('payment_requests', 'limit=200&order=created_at.desc&select=*'),
          sbQuery('promo_codes', 'limit=50&select=*'),
          sbQuery('badges', 'limit=20&select=*'),
          sbQuery('support_tickets', 'limit=100&order=created_at.desc&select=*'),
          sbQuery('courses', 'limit=20&order=title.asc&select=*'),
          sbQuery('subjects', 'limit=200&order=title.asc&select=*'),
          sbQuery('topics', 'limit=2000&order=title.asc&select=*'),
          sbQuery('attempts', 'limit=50&order=created_at.desc&select=*')
        ]);
        
        console.log('Supabase counts:', {
          profiles: profiles.length,
          subscriptions: subscriptions.length,
          payments: payments.length,
          promoCodes: promoCodes.length,
          supportTickets: supportTickets.length,
          courses: courses.length,
          subjects: subjects.length,
          topics: topics.length
        });

        // ---- 1. BUILD COURSE MAPPINGS & POPULATE ALL 6 COURSES ----
        const courseIdToNum = {};
        const courseNumToId = {};
        if (courses && courses.length > 0) {
          courses.forEach(c => {
            const m = c.title.match(/(\d+)/);
            const num = m ? m[1] : '1';
            courseIdToNum[c.id] = num;
            courseNumToId[num] = c.id;
          });
        }

        // Standard 6 academic courses
        AppState.courses = [1, 2, 3, 4, 5, 6].map(num => {
          const suffix = num === 1 ? 'st' : num === 2 ? 'nd' : num === 3 ? 'rd' : 'th';
          const title = num + suffix + ' Course';
          const sbCourse = (courses || []).find(c => c.title.includes(num + suffix) || c.title.includes(num));
          return {
            id: 'c' + num,
            supabase_id: sbCourse ? sbCourse.id : null,
            course_number: num,
            title: title,
            is_active: true
          };
        });
        AppState.stats.totalCourses = AppState.courses.length;

        // ---- 2. BUILD ALL 128 SUBJECTS ACROSS ALL COURSES ----
        if (subjects && subjects.length > 0) {
          // Count MCQs per subject from AppState.mcqs
          const mcqCountBySubjTitle = {};
          (AppState.mcqs || []).forEach(m => {
            const st = (m.subject || '').toLowerCase().trim();
            mcqCountBySubjTitle[st] = (mcqCountBySubjTitle[st] || 0) + 1;
          });

          // Map all 128 Supabase subjects
          const mappedSubjects = subjects.map(s => {
            const cNum = courseIdToNum[s.course_id] || '1';
            const courseKey = 'c' + cNum;
            const lowerTitle = (s.title || '').toLowerCase();
            
            let icon = '📚';
            if (lowerTitle.includes('anat')) icon = '🦴';
            else if (lowerTitle.includes('chem')) icon = '🧪';
            else if (lowerTitle.includes('bioch')) icon = '🧬';
            else if (lowerTitle.includes('micro')) icon = '🦠';
            else if (lowerTitle.includes('biol')) icon = '🌱';
            else if (lowerTitle.includes('surg')) icon = '🔪';
            else if (lowerTitle.includes('med')) icon = '🩺';
            else if (lowerTitle.includes('physio')) icon = '⚡';
            else if (lowerTitle.includes('patho')) icon = '🔬';
            else if (lowerTitle.includes('pharma')) icon = '💊';
            else if (lowerTitle.includes('pediat')) icon = '👶';
            else if (lowerTitle.includes('obste') || lowerTitle.includes('gynec')) icon = '🤰';
            else if (lowerTitle.includes('neuro')) icon = '🧠';
            else if (lowerTitle.includes('dent')) icon = '🦷';
            else if (lowerTitle.includes('derm')) icon = '🧴';

            const localCount = mcqCountBySubjTitle[lowerTitle] || 0;
            return {
              id: s.id,
              supabase_id: s.id,
              course_id: courseKey,
              raw_course_id: s.course_id,
              course_number: parseInt(cNum),
              title: s.title,
              code: s.title.substring(0, 8).toUpperCase(),
              icon: icon,
              is_active: true,
              mcqCount: localCount
            };
          });

          // Also ensure local offline subjects from real_mcqs.json are preserved
          (compiledSubjects || []).forEach(cs => {
            const exists = mappedSubjects.some(ms => ms.title.toLowerCase().trim() === cs.title.toLowerCase().trim());
            if (!exists) {
              mappedSubjects.push(cs);
            } else {
              // Transfer count
              const found = mappedSubjects.find(ms => ms.title.toLowerCase().trim() === cs.title.toLowerCase().trim());
              if (found && cs.mcqCount > found.mcqCount) found.mcqCount = cs.mcqCount;
            }
          });

          AppState.subjects = mappedSubjects;
          AppState.stats.totalSubjects = mappedSubjects.length;
        }

        // ---- 3. MAP ALL TOPICS (1,930 topics) ----
        if (topics && topics.length > 0) {
          const mappedTopics = topics.map(t => ({
            id: t.id,
            supabase_id: t.id,
            subject_id: t.subject_id,
            title: t.title,
            is_master: false,
            is_active: true,
            mcqCount: 0
          }));

          // Merge local topics
          (compiledTopics || []).forEach(ct => {
            if (!mappedTopics.some(mt => mt.id === ct.id)) mappedTopics.push(ct);
          });

          AppState.topics = mappedTopics;
          AppState.stats.totalTopics = mappedTopics.length;
        }
        
        // ---- 4. MAP SUBSCRIPTIONS ----
        const subsMap = {};
        subscriptions.forEach(s => {
          if (!subsMap[s.user_id] || new Date(s.end_date) > new Date(subsMap[s.user_id].end_date)) {
            subsMap[s.user_id] = s;
          }
        });
        
        // ---- 5. MAP USERS / MEMBERS (304 real students) ----
        if (profiles && profiles.length > 0) {
          const mappedUsers = profiles.map(p => {
            const sub = subsMap[p.id];
            let plan = 'Free Tier';
            let isPremium = false;
            let daysLeft = 0;
            if (sub) {
              const endDate = new Date(sub.end_date);
              daysLeft = Math.ceil((endDate - new Date()) / (1000*60*60*24));
              if (daysLeft > 0 && sub.status === 'active') {
                plan = 'Premium (' + daysLeft + 'd left)';
                isPremium = true;
              } else {
                plan = 'Expired';
              }
            }
            return {
              id: p.id,
              full_name: p.name || (p.email ? p.email.split('@')[0] : 'Student'),
              email: p.email || 'N/A',
              role: p.role === 'admin' ? 'admin' : 'student',
              course_number: 1,
              coins: p.coins || 0,
              streak_days: p.streak || 0,
              plan: plan,
              is_premium: isPremium,
              days_left: Math.max(0, daysLeft),
              sub_id: sub ? sub.id : null,
              sub_end_date: sub ? sub.end_date : null,
              is_locked: p.status === 'blocked',
              joined: p.created_at ? new Date(p.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Unknown',
              accuracy: p.accuracy || 0,
              total_attempted: p.total_attempted || 0,
              total_correct: p.total_correct || 0,
              total_wrong: p.total_wrong || 0,
              status: p.status || 'active'
            };
          });
          
          const superAdmin = {
            id: 'usr-1',
            full_name: 'Super Admin (Owner)',
            email: 'mohd6396889713@gmail.com',
            role: 'super_admin',
            course_number: 6,
            coins: 5000,
            streak_days: 45,
            plan: 'Lifetime VIP',
            is_premium: true,
            days_left: 9999,
            is_locked: false,
            joined: 'Sep 2025',
            accuracy: 100,
            total_attempted: 1500,
            status: 'active'
          };
          
          AppState.users = [superAdmin, ...mappedUsers];
          AppState.stats.totalUsers = profiles.length + 1;
          
          try {
            localStorage.setItem('samu_admin_users', JSON.stringify(AppState.users));
          } catch(e) {}
        }
        
        // ---- 6. MAP PAYMENTS (92 real payments) ----
        if (payments && payments.length > 0) {
          const profileMap = {};
          AppState.users.forEach(u => { profileMap[u.id] = u; });
          
          const promoMap = {};
          (promoCodes || []).forEach(pc => { promoMap[pc.id] = pc.code; });
          
          AppState.payments = payments.map(p => {
            const user = profileMap[p.user_id] || {};
            const promoCode = promoMap[p.promo_code_id] || (p.transaction_id && p.transaction_id.includes('TRH') ? 'TRH Promo' : null);
            return {
              id: p.id,
              user_id: p.user_id,
              user_name: user.full_name || 'Student (' + (p.user_id ? p.user_id.substring(0,8) : 'N/A') + ')',
              user_email: user.email || 'N/A',
              plan: p.amount > 0 ? 'Premium Plan ($' + p.amount + ')' : (promoCode ? 'Promo Access (' + promoCode + ')' : 'Free Plan'),
              amount: p.amount || 0,
              currency: 'USD',
              payment_method: p.payment_method || (promoCode ? 'Promo Code (' + promoCode + ')' : 'Online Payment'),
              transaction_id: p.transaction_id || p.payment_reference || 'REF-' + (p.id ? p.id.substring(0,8) : '00'),
              payment_reference: p.payment_reference || '',
              promo_code: promoCode,
              proof_url: p.proof_image_url || '',
              status: p.status || 'approved',
              created_at: p.created_at ? new Date(p.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'N/A',
              raw_created: p.created_at
            };
          });
          
          const pending = AppState.payments.filter(p => p.status === 'pending');
          const approved = AppState.payments.filter(p => p.status === 'approved');
          AppState.stats.pendingPayments = pending.length;
          AppState.stats.activeSubscriptions = approved.length;
          AppState.stats.totalRevenue = approved.reduce((sum, p) => sum + (p.amount || 0), 0);
          
          const badge = document.getElementById('badgePendingPayments');
          if (badge) badge.innerText = pending.length;
        }
        
        // ---- 7. MAP PROMO CODES (3 real promo codes) ----
        if (promoCodes && promoCodes.length > 0) {
          AppState.coupons = promoCodes.map(pc => ({
            id: pc.id,
            code: pc.code,
            discount_percentage: pc.discount_percentage,
            usage_limit: pc.usage_limit,
            current_usage: pc.current_usage || 0,
            is_active: pc.is_active,
            created_at: pc.created_at ? new Date(pc.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : ''
          }));
        }
        
        // ---- 8. MAP BADGES ----
        if (badges && badges.length > 0) AppState.badges = badges;
        
        // ---- 9. MAP SUPPORT TICKETS ----
        if (supportTickets && supportTickets.length > 0) {
          const profileMap = {};
          AppState.users.forEach(u => { profileMap[u.id] = u; });
          AppState.supportTickets = supportTickets.map(t => ({
            ...t,
            user_name: profileMap[t.user_id]?.full_name || 'Student (' + (t.user_id ? t.user_id.substring(0,8) : 'N/A') + ')',
            user_email: profileMap[t.user_id]?.email || 'N/A',
            created_formatted: t.created_at ? new Date(t.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''
          }));
        }
        
        // Update header live badge
        const liveIndicator = document.getElementById('liveSupabaseIndicator');
        if (liveIndicator) {
          liveIndicator.innerHTML = '🟢 Live Supabase Connected · ' + AppState.users.length + ' Members · ' + AppState.subjects.length + ' Subjects · ' + AppState.payments.length + ' Payments';
          liveIndicator.className = 'px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300 flex items-center gap-1.5 shadow-sm';
        }
        
        // Re-render
        renderApp();
        showToast('🟢 Live Synced: ' + AppState.users.length + ' students · ' + AppState.subjects.length + ' subjects across 6 courses · ' + AppState.payments.length + ' payments', 'success');
      } catch(e) {
        console.error('Supabase load error:', e);
        showToast('Failed to sync from Supabase: ' + e.message, 'error');
      } finally {
        if (syncBtn) { syncBtn.innerHTML = '🔄 Sync Real Data'; syncBtn.disabled = false; }
      }
    };

    </script>
</head>

    // --- TOAST NOTIFICATION HELPER ---
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const isErr = type === 'error';
      toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl text-xs font-bold border transition-all duration-300 transform translate-y-2 ${
        isErr ? 'bg-red-50 border-red-300 text-red-800' : 'bg-emerald-50 border-emerald-300 text-emerald-800'
      }`;
      toast.innerHTML = `<span>${isErr ? '⚠️' : '✅'}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function onCourseChange(courseId) {
      AppState.selectedCourseId = courseId;
      AppState.mcqPage = 1;
      
      const subjectsInCourse = AppState.subjects.filter(s => s.course_id === courseId);
      AppState.selectedSubjectId = subjectsInCourse.length > 0 ? subjectsInCourse[0].id : '';
      
      const topicsInSubject = AppState.topics.filter(t => t.subject_id === AppState.selectedSubjectId);
      AppState.selectedTopicId = 'all';
      
      renderApp();
    }

    function onSubjectChange(subjectId) {
      AppState.selectedSubjectId = subjectId;
      AppState.mcqPage = 1;
      AppState.selectedTopicId = 'all';
      renderApp();
    }

    function onTopicChange(topicId) {
      AppState.selectedTopicId = topicId;
      AppState.mcqPage = 1;
      renderApp();
      
      // If it is a Supabase UUID topic, load its questions live from Supabase
      if (topicId && topicId !== 'all' && (topicId.length > 20 || topicId.includes('-'))) {
        if (typeof loadSupabaseMCQsForTopic === 'function') {
          loadSupabaseMCQsForTopic(topicId);
        }
      }
    }

    function onTaskTypeChange(type) {
      AppState.selectedTaskType = type;
      AppState.mcqPage = 1;
      renderApp();
    }

    function onSearchChange(query) {
      AppState.searchQuery = (query || '').toLowerCase().trim();
      AppState.mcqPage = 1;
      renderMCQCardsOnly();
    }

    function changeMCQPage(newPage) {
      AppState.mcqPage = newPage;
      renderMCQCardsOnly();
      const container = document.getElementById('mcqCardsContainer');
      if (container) {
        container.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function getFilteredMCQs() {
      const courseNum = AppState.selectedCourseId ? AppState.selectedCourseId.replace('c', '') : '1';
      const activeSubj = (AppState.subjects || []).find(s => s.id === AppState.selectedSubjectId);
      const subjectTitle = activeSubj ? (activeSubj.title || '').toLowerCase().trim() : '';

      const activeTopic = (AppState.topics || []).find(t => t.id === AppState.selectedTopicId);
      const topicTitle = activeTopic ? (activeTopic.title || '').toLowerCase().trim() : '';

      return (AppState.mcqs || []).filter(q => {
        // Match Course
        const qCourse = String(q.course || '1');
        if (AppState.selectedCourseId && qCourse !== courseNum) {
          // If question has a subject linked to another course, check it
          if (q.course_number && String(q.course_number) !== courseNum) return false;
        }

        // Match Subject
        if (AppState.selectedSubjectId) {
          const qSubj = (q.subject || '').toLowerCase().trim();
          const matchSubjId = q.subject_id === AppState.selectedSubjectId || (activeSubj && activeSubj.supabase_id && q.subject_id === activeSubj.supabase_id);
          const matchSubjTitle = subjectTitle && (qSubj === subjectTitle || qSubj.includes(subjectTitle) || subjectTitle.includes(qSubj));
          if (!matchSubjId && !matchSubjTitle) return false;
        }

        // Match Topic
        if (AppState.selectedTopicId && AppState.selectedTopicId !== 'all') {
          const qTop = (q.topic || '').toLowerCase().trim();
          const matchTopicId = q.topic_id === AppState.selectedTopicId;
          const matchTopicTitle = topicTitle && (qTop === topicTitle || qTop.includes(topicTitle) || topicTitle.includes(qTop));
          if (!matchTopicId && !matchTopicTitle) return false;
        }

        // Match Task Type
        if (AppState.selectedTaskType && AppState.selectedTaskType !== 'all') {
          if (q.task_type !== AppState.selectedTaskType) return false;
        }

        // Match Search Query
        if (AppState.searchQuery) {
          const stem = (q.question || '').toLowerCase();
          const opts = (q.options || []).join(' ').toLowerCase();
          const expl = (q.explanation || '').toLowerCase();
          const ref = (q.reference || q.reference_text || '').toLowerCase();
          const qry = AppState.searchQuery;
          if (!stem.includes(qry) && !opts.includes(qry) && !expl.includes(qry) && !ref.includes(qry)) {
            return false;
          }
        }

        return true;
      });
    }

    function saveEditMCQ(mcqId) {
      const qIndex = AppState.mcqs.findIndex(m => m.id === mcqId);
      if (qIndex === -1) return showToast('Question not found in repository', 'error');

      const questionText = document.getElementById('editMCQQ').value.trim();
      if (!questionText) return showToast('Question stem cannot be empty', 'error');

      const options = [
        document.getElementById('editOpt0').value.trim() || 'Option A',
        document.getElementById('editOpt1').value.trim() || 'Option B',
        document.getElementById('editOpt2').value.trim() || 'Option C',
        document.getElementById('editOpt3').value.trim() || 'Option D'
      ];

      const correctRadio = document.querySelector('input[name="editCorrectOpt"]:checked');
      const correctIdx = correctRadio ? parseInt(correctRadio.value) : 0;
      const explanation = document.getElementById('editMCQExpl').value.trim();
      const difficulty = document.getElementById('editMCQDiff').value;
      const taskType = document.getElementById('editMCQType').value;
      const tagsRaw = document.getElementById('editMCQTags').value;
      const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
      const reference = document.getElementById('editMCQRef').value.trim();

      // Update in AppState
      AppState.mcqs[qIndex].question = questionText;
      AppState.mcqs[qIndex].task_type = taskType;
      AppState.mcqs[qIndex].difficulty = difficulty;
      AppState.mcqs[qIndex].options = options;
      AppState.mcqs[qIndex].correct_index = correctIdx;
      AppState.mcqs[qIndex].correctIndex = correctIdx;
      AppState.mcqs[qIndex].explanation = explanation;
      AppState.mcqs[qIndex].tags = tags;
      AppState.mcqs[qIndex].reference = reference;

      saveMCQsToStorage();
      closeModal();
      renderMCQCardsOnly();

      // Live Sync to Supabase if it has UUID ID format or Supabase source
      if (mcqId && (mcqId.length > 20 || mcqId.includes('-'))) {
        sbPatch('mcqs', mcqId, {
          question: questionText,
          options: options,
          correct_index: correctIdx,
          explanation: explanation,
          task_type: taskType
        }).then(res => {
          if (res) {
            showToast('✅ Question live-updated in Supabase & Website!', 'success');
            addAuditLog('MCQ_EDIT', 'mcqs', mcqId, 'Updated question: ' + questionText.substring(0, 40));
          } else {
            showToast('Question saved locally.', 'info');
          }
        });
      } else {

      const q = AppState.mcqs.find(m => m.id === mcqId);
      AppState.mcqs = AppState.mcqs.filter(m => m.id !== mcqId);
      AppState.stats.totalMCQs = AppState.mcqs.length;

      saveMCQsToStorage();
      renderMCQCardsOnly();

      // Sync to Supabase if UUID format
      if (mcqId && (mcqId.length > 20 || mcqId.includes('-'))) {
        sbDelete('mcqs', mcqId).then(res => {
          showToast('🗑️ Question permanently deleted from Supabase & Website.', 'success');

        });
      } else {
        showToast('🗑️ Question deleted from local question bank.', 'success');

    }

    function duplicateMCQ(mcqId) {
      const q = AppState.mcqs.find(m => m.id === mcqId);
      if (!q) return;

      const clone = {
        ...JSON.parse(JSON.stringify(q)),
        id: 'q_copy_' + Date.now(),
        question: q.question + ' (Copy)'
      };

      AppState.mcqs.unshift(clone);
      AppState.stats.totalMCQs = AppState.mcqs.length;

      saveMCQsToStorage();
      showToast('Question duplicated!', 'success');
      renderMCQCardsOnly();
    }

    function saveCreateMCQ() {
      const questionText = document.getElementById('newMCQQ').value.trim();
      if (!questionText) return showToast('Question stem is required', 'error');

      const options = [
        document.getElementById('newOpt0').value.trim(),
        document.getElementById('newOpt1').value.trim(),
        document.getElementById('newOpt2').value.trim(),
        document.getElementById('newOpt3').value.trim()
      ];

      if (options.some(o => !o)) {
        return showToast('All 4 options must be filled', 'error');
      }

      const correctRadio = document.querySelector('input[name="newCorrectOpt"]:checked');
      const correctIdx = correctRadio ? parseInt(correctRadio.value) : 0;

      const courseId = document.getElementById('newMCQCourse').value;
      const subjectId = document.getElementById('newMCQSubject').value;
      const topicId = document.getElementById('newMCQTopic').value;
      const taskType = document.getElementById('newMCQType').value;
      const difficulty = document.getElementById('newMCQDiff').value;
      const explanation = document.getElementById('newMCQExpl').value.trim();
      const tagsRaw = document.getElementById('newMCQTags').value;
      const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
      const reference = document.getElementById('newMCQRef').value.trim();

      const activeSubject = AppState.subjects.find(s => s.id === subjectId);
      const activeTopic = AppState.topics.find(t => t.id === topicId);
      const courseNum = courseId.replace('c', '');

      const newId = 'q_custom_' + Date.now();
      const newMCQ = {
        id: newId,
        course: courseNum,
        course_name: courseNum + (courseNum === '1' ? 'st' : (courseNum === '2' ? 'nd' : 'th')) + ' Course',
        subject_id: subjectId,
        subject: activeSubject ? activeSubject.title : 'General',
        topic_id: topicId,
        topic: activeTopic ? activeTopic.title : 'Topic 1',
        task_type: taskType,
        question: questionText,
        options: options,
        correct_index: correctIdx,
        correctIndex: correctIdx,
        explanation: explanation || 'Standard clinical curriculum choice.',
        difficulty: difficulty,
        reference: reference || 'Standard Medical Curriculum',
        tags: tags
      };

      AppState.mcqs.unshift(newMCQ);
      AppState.stats.totalMCQs = AppState.mcqs.length;

      saveMCQsToStorage();
      closeModal();
      renderMCQCardsOnly();

      // If topicId is a UUID from Supabase, also insert into Supabase mcqs table!
      if (topicId && topicId.length > 20 && topicId.includes('-')) {
        sbInsert('mcqs', {
          topic_id: topicId,
          question: questionText,
          options: options,
          correct_index: correctIdx,
          explanation: explanation,
          task_type: taskType
        }).then(inserted => {
          if (inserted && inserted.id) {
            newMCQ.id = inserted.id;
            saveMCQsToStorage();
            showToast('✅ Question successfully created & published to Supabase!', 'success');
            addAuditLog('MCQ_CREATE', 'mcqs', inserted.id, 'Created new question in ' + (activeTopic ? activeTopic.title : 'topic'));
          } else {
            showToast('✅ Question created locally in topic!', 'success');
          }
        });
      } else {
        showToast('✅ Question created in topic question bank!', 'success');
      }
    }

    function saveMCQsToStorage() {
      try {
        localStorage.setItem('ssmu_admin_mcqs', JSON.stringify(AppState.mcqs));
        localStorage.setItem('samu_custom_mcqs', JSON.stringify(AppState.mcqs));
      } catch (e) {
        console.warn('LocalStorage save error:', e);
      }
    }

    async function saveEditUser(userId) {
      const u = AppState.users.find(usr => usr.id === userId);
      if (!u) return;

      const name = document.getElementById('editUserName').value.trim();
      const email = document.getElementById('editUserEmail').value.trim();
      const role = document.getElementById('editUserRole').value;
      const status = document.getElementById('editUserStatus')?.value || u.status || 'active';
      if (!name || !email) return showToast('Name and email are required', 'error');

      u.full_name = name;
      u.email = email;
      u.role = role;
      u.status = status;
      u.is_locked = status === 'blocked';
      
      saveUsersToStorage();
      closeModal();
      renderUsers(document.getElementById('mainContainer'));

      // Live update in Supabase
      if (userId && (userId.length > 20 || userId.includes('-'))) {
        const res = await sbPatch('profiles', userId, { name, role, status });
        if (res) {
          showToast('✅ Student profile updated in Supabase!', 'success');
          addAuditLog('USER_EDIT', 'profiles', userId, 'Updated student: ' + name);
        } else {
          showToast('Profile updated locally.', 'info');
        }
      } else {
        showToast('Member updated.', 'success');
      }
    }

    function saveNewUser() {
      const name = document.getElementById('newUserName').value.trim();
      const email = document.getElementById('newUserEmail').value.trim();
      if (!name || !email) return showToast('Full name and email are required', 'error');

      const newUser = {
        id: 'usr_' + Date.now(),
        full_name: name,
        email: email,
        role: document.getElementById('newUserRole').value,
        course_number: parseInt(document.getElementById('newUserCourse').value),
        plan: document.getElementById('newUserPlan').value,
        coins: parseInt(document.getElementById('newUserCoins').value) || 500,
        streak_days: 1,
        is_locked: false,
        joined: 'Just now'
      };

      AppState.users.unshift(newUser);
      AppState.stats.totalUsers += 1;
      saveUsersToStorage();
      closeModal();
      showToast('✓ New member registered!', 'success');
      renderUsers(document.getElementById('mainContainer'));
    }

    async function toggleLockUser(userId) {
      const u = AppState.users.find(usr => usr.id === userId);
      if (!u) return;
      u.is_locked = !u.is_locked;
      u.status = u.is_locked ? 'blocked' : 'active';
      saveUsersToStorage();
      
      // Live sync to Supabase profiles
      if (userId && (userId.length > 20 || userId.includes('-'))) {
        await sbPatch('profiles', userId, { status: u.status });
        showToast(u.is_locked ? '🔒 Student blocked in Supabase.' : '🔓 Student unblocked in Supabase.', 'success');
        addAuditLog('USER_LOCK', 'profiles', userId, (u.is_locked ? 'Blocked' : 'Unblocked') + ' user: ' + u.full_name);
      } else {
        showToast(u.is_locked ? 'Account locked.' : 'Account unlocked.', 'success');
      }
      renderUsers(document.getElementById('mainContainer'));
    }

    async function deleteUser(userId) {
      if (!confirm('Are you sure you want to permanently remove this student from Supabase and the system?')) return;
      const u = AppState.users.find(usr => usr.id === userId);
      AppState.users = AppState.users.filter(usr => usr.id !== userId);
      AppState.stats.totalUsers = AppState.users.length;
      saveUsersToStorage();

      // Live delete from Supabase
      if (userId && (userId.length > 20 || userId.includes('-'))) {
        await sbDelete('profiles', userId);
        showToast('🗑️ Student permanently deleted from Supabase database.', 'success');
        addAuditLog('USER_DELETE', 'profiles', userId, 'Deleted student: ' + (u ? u.full_name : userId));
      } else {
        showToast('Member removed.', 'success');
      }
      renderUsers(document.getElementById('mainContainer'));
    }

    function saveUsersToStorage() {
      try {
        localStorage.setItem('samu_admin_users', JSON.stringify(AppState.users.map(u => ({
          id: u.id,
          name: u.full_name,
          email: u.email,
          role: u.role,
          course_number: u.course_number,
          coins: u.coins,
          streak_days: u.streak_days,
          plan: u.plan,
          is_locked: u.is_locked,
          status: u.is_locked ? 'blocked' : 'active',
          joined: u.joined
        }))));
      } catch (e) {
        console.warn('LocalStorage save error:', e);
      }
    }

    function approvePayment(id) {
      // Update local state
      const payment = AppState.payments.find(p => p.id === id);
      if (payment) payment.status = 'approved';
      const pending = AppState.payments.filter(p => p.status === 'pending');
      AppState.stats.pendingPayments = pending.length;
      AppState.stats.activeSubscriptions += 1;
      const badge = document.getElementById('badgePendingPayments');
      if (badge) badge.innerText = pending.length;
      // Update in Supabase
      sbPatch('payment_requests', id, { status: 'approved' }).then(() => {
        showToast('✓ Payment approved in Supabase! Subscription activated for student.', 'success');
      });
      renderApp();
    }

    function rejectPayment(id) {
      // Update local state
      const payment = AppState.payments.find(p => p.id === id);
      if (payment) payment.status = 'rejected';
      const pending = AppState.payments.filter(p => p.status === 'pending');
      AppState.stats.pendingPayments = pending.length;
      const badge = document.getElementById('badgePendingPayments');
      if (badge) badge.innerText = pending.length;
      // Update in Supabase
      sbPatch('payment_requests', id, { status: 'rejected' }).then(() => {
        showToast('Payment rejected and updated in Supabase.', 'error');
      });
      renderApp();
    }

    function saveNewMCQ() {
      const q = document.getElementById('newMCQQ').value.trim();
      if (!q) return showToast('Please enter a question stem', 'error');

      const targetTopicId = document.getElementById('newMCQTopic').value;

      const options = [
        document.getElementById('newOpt0').value.trim() || 'Option A',
        document.getElementById('newOpt1').value.trim() || 'Option B',
        document.getElementById('newOpt2').value.trim() || 'Option C',
        document.getElementById('newOpt3').value.trim() || 'Option D'
      ];
      const correctRadio = document.querySelector('input[name="newCorrectOpt"]:checked');
      const correctIdx = correctRadio ? parseInt(correctRadio.value) : 0;

      const tagsRaw = document.getElementById('newMCQTags').value;
      const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];

      const newQ = {
        id: 'mcq_custom_' + Date.now(),
        topic_id: targetTopicId,
        task_type: document.getElementById('newMCQType').value,
        question: q,
        options,
        correct_index: correctIdx,
        explanation: document.getElementById('newMCQExpl').value.trim() || 'Standard curriculum guideline rationale.',
        difficulty: document.getElementById('newMCQDiff').value,
        tags,
        reference_text: document.getElementById('newMCQRef').value.trim() || 'SSMU Academic Board 2026',
        is_active: true
      };

      AppState.mcqs.unshift(newQ);
      AppState.stats.totalMCQs += 1;

      // Update current selected topic so the user immediately sees their new question
      AppState.selectedTopicId = targetTopicId;

      try {
        localStorage.setItem('ssmu_admin_mcqs', JSON.stringify(AppState.mcqs));
      } catch (e) {
        console.warn('LocalStorage save error:', e);
      }

      closeModal();
      showToast('✓ New question successfully added to question bank!', 'success');
      renderApp();
    }

    // ---- MCQ MANAGEMENT HELPERS (Supabase) ----
    
    // Load MCQs for selected topic from Supabase
    async function loadSupabaseMCQsForTopic(topicId) {
      if (!topicId || topicId === 'all') return;
      showToast('Loading real MCQs from Supabase for this topic...', 'info');
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/mcqs?topic_id=eq.' + topicId + '&limit=100&select=*', {
          headers: { 'apikey': SUPABASE_SERVICE_KEY, 'Authorization': 'Bearer ' + SUPABASE_SERVICE_KEY }
        });
        const mcqs = await res.json();
        if (Array.isArray(mcqs) && mcqs.length > 0) {
          // Convert Supabase format to AppState format
          const converted = mcqs.map(m => ({
            id: m.id,
            question: m.question,
            options: Array.isArray(m.options) ? m.options : [],
            correct: typeof m.correct_index === 'number' ? m.correct_index : 0,
            explanation: m.explanation || '',
            difficulty: m.difficulty || 'medium',
            task_type: m.task_type || 'test_question',
            topic_id: m.topic_id,
            source: 'supabase',
            // Map to AppState structure
            topic: AppState.topics ? (AppState.topics.find(t=>t.id===m.topic_id)||{}).title || 'Unknown' : 'Unknown'
          }));
          // Merge/replace in AppState.mcqs for this topic
          const otherMcqs = AppState.mcqs.filter(m => m.topic_id !== topicId && m.supabaseTopic !== topicId);
          AppState.mcqs = [...otherMcqs, ...converted];
          AppState.supabaseMCQTopicId = topicId;
          showToast('Loaded ' + converted.length + ' real MCQs from Supabase for this topic', 'success');
          renderApp();
        } else {
          showToast('No MCQs found in Supabase for this topic (try local data instead)', 'info');
        }
      } catch(e) {
        showToast('Failed to load Supabase MCQs: ' + e.message, 'error');
      }
    }
    
    // Update a single MCQ in Supabase
    async function updateMCQInSupabase(id, updates) {
      // Convert from AppState format to Supabase format
      const sbUpdates = {};
      if (updates.question !== undefined) sbUpdates.question = updates.question;
      if (updates.options !== undefined) sbUpdates.options = updates.options;
      if (updates.correct !== undefined) sbUpdates.correct_index = updates.correct;
      if (updates.explanation !== undefined) sbUpdates.explanation = updates.explanation;
      if (updates.difficulty !== undefined) sbUpdates.difficulty = updates.difficulty;
      
      const result = await sbPatch('mcqs', id, sbUpdates);
      if (result && !result.code) {
        addAuditLog('MCQ_UPDATE', 'mcqs', id, 'Updated MCQ: ' + (updates.question||'').substring(0,50));
        return true;
      }
      return false;
    }

      if (ok !== false) {
        addAuditLog('MCQ_DELETE', 'mcqs', id, 'Deleted MCQ');
        return true;
      }
      return false;
    }

      // Get form data
      const q = document.getElementById('editQuestion')?.value;
      const opts = ['editOpt0','editOpt1','editOpt2','editOpt3'].map(id2 => document.getElementById(id2)?.value || '');

      if (mcq) {

    // Helper: Load all thread messages from Supabase for a ticket
    async function loadThreadMessages(ticketId) {
      const container = document.getElementById('threadMessagesContainer');
      if (!container) return;

      try {
        const msgs = await sbQuery('ticket_messages', 'ticket_id=eq.' + ticketId + '&order=created_at.asc');
        if (!msgs || msgs.length === 0) {
          container.innerHTML = '<div class="text-center py-6 text-xs text-slate-400">No previous replies in this thread. Write the first response below!</div>';
          return;
        }

        container.innerHTML = msgs.map(m => {
          const isAdmin = m.is_admin_reply;
          const time = m.created_at ? new Date(m.created_at).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' }) : '';
          return `
            <div class="flex flex-col ${isAdmin ? 'items-end' : 'items-start'}">
              <div class="flex items-center gap-1.5 mb-0.5">
                <span class="text-[10px] font-extrabold ${isAdmin ? 'text-blue-700' : 'text-slate-600'}">
                  ${isAdmin ? '🛡️ Super Admin' : '👤 Student'}
                </span>
                <span class="text-[10px] text-slate-400">${time}</span>
              </div>
              <div class="max-w-[85%] p-3 rounded-2xl text-xs leading-relaxed shadow-sm ${
                isAdmin
                  ? 'bg-blue-700 text-white rounded-tr-none font-medium'
                  : 'bg-white border border-slate-200 text-slate-900 rounded-tl-none font-medium'
              }">
                ${m.message}
              </div>
            </div>
          `;
        }).join('');

        // Scroll to bottom
        container.scrollTop = container.scrollHeight;
      } catch(e) {
        container.innerHTML = '<div class="text-center py-4 text-xs text-red-500">Failed to load messages: ' + e.message + '</div>';
      }
    }

    // Helper: Send reply to student and save in Supabase
    async function sendTicketReply(ticketId) {
      const textarea = document.getElementById('ticketReplyInput');
      const btn = document.getElementById('btnSendReply');
      if (!textarea) return;

      const replyText = textarea.value.trim();
      if (!replyText) return showToast('Please enter a reply message before sending', 'error');

      if (btn) { btn.disabled = true; btn.innerText = 'Sending...'; }

      try {
        // 1. Insert into Supabase ticket_messages
        const newMsg = await sbInsert('ticket_messages', {
          ticket_id: ticketId,
          message: replyText,
          is_admin_reply: true,
          created_at: new Date().toISOString()
        });

        // 2. Determine new status
        const chkResolve = document.getElementById('chkResolveAfterReply');
        const newStatus = chkResolve && chkResolve.checked ? 'RESOLVED' : 'IN_PROGRESS';

        // 3. Update support_tickets row in Supabase
        await sbPatch('support_tickets', ticketId, {
          status: newStatus,
          updated_at: new Date().toISOString()
        });

        // 4. Update local state
        const t = (AppState.supportTickets || []).find(x => x.id === ticketId);
        if (t) {
          t.status = newStatus;
          t.updated_at = new Date().toISOString();
        }

        addAuditLog('TICKET_REPLY', 'support_tickets', ticketId, 'Sent reply: ' + replyText.substring(0, 50));
        showToast('✅ Reply successfully sent and saved in Supabase!', 'success');

        // Clear input and reload thread
        textarea.value = '';
        await loadThreadMessages(ticketId);

        // Re-render main table in background
        renderCommunications(document.getElementById('mainContainer'));
      } catch(e) {
        console.error('Send reply error:', e);
        showToast('Failed to send reply: ' + e.message, 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.innerText = '📨 Send Reply to Student'; }
      }
    }

    // ---- PREMIUM DAYS MANAGEMENT (Live Supabase) ----

    // Adjust user premium days by delta (+30, -30, etc.)
    async function adjustUserPremiumDays(userId, deltaDays) {
      const u = (AppState.users || []).find(x => x.id === userId);
      if (!u) return;

      const currentDays = Math.max(0, u.days_left || 0);
      const newDays = Math.max(0, currentDays + deltaDays);
      
      const newEndDate = new Date(Date.now() + newDays * 24 * 60 * 60 * 1000).toISOString();
      const newPlan = newDays > 0 ? 'Premium (' + newDays + 'd left)' : 'Expired';
      const isPrem = newDays > 0;

      showToast((deltaDays > 0 ? 'Adding ' : 'Subtracting ') + Math.abs(deltaDays) + ' days for ' + u.full_name + ' in Supabase...', 'info');

      try {
        if (userId && (userId.length > 20 || userId.includes('-'))) {
          // Check existing subscription
          const existing = await sbQuery('subscriptions', 'user_id=eq.' + userId);
          if (existing && existing.length > 0) {
            await sbPatch('subscriptions', existing[0].id, {
              status: isPrem ? 'active' : 'expired',
              end_date: newEndDate,
              updated_at: new Date().toISOString()
            });
          } else {
            await sbInsert('subscriptions', {
              user_id: userId,
              status: isPrem ? 'active' : 'expired',
              start_date: new Date().toISOString(),
              end_date: newEndDate
            });
          }
        }

        // Update local state
        u.days_left = newDays;
        u.plan = newPlan;
        u.is_premium = isPrem;
        u.sub_end_date = newEndDate;

        saveUsersToStorage();
        renderUsers(document.getElementById('mainContainer'));
        showToast('✓ Updated: ' + u.full_name + ' now has ' + newDays + ' days of premium!', 'success');
        addAuditLog('ADJUST_DAYS', 'subscriptions', userId, (deltaDays > 0 ? '+' : '') + deltaDays + ' days (Total: ' + newDays + 'd)');
      } catch(e) {
        showToast('Failed to update days: ' + e.message, 'error');
      }
    }

    // Set custom number of days for user
    async function setCustomPremiumDays(userId) {
      const u = (AppState.users || []).find(x => x.id === userId);
      if (!u) return;

      const input = prompt('Enter total days of Premium access for ' + u.full_name + ':\n(e.g., 7, 30, 90, 180, 365, or 0 to expire)', String(u.days_left || 30));
      if (input === null) return;
      const days = parseInt(input);
      if (isNaN(days) || days < 0) return showToast('Please enter a valid positive number of days', 'error');

      const delta = days - (u.days_left || 0);
      await adjustUserPremiumDays(userId, delta);
    }

    // Save edit user including premium days in Supabase
    async function saveEditUserWithDays(userId) {
      const u = (AppState.users || []).find(usr => usr.id === userId);
      if (!u) return;

      const name = document.getElementById('editUserName').value.trim();
      const email = document.getElementById('editUserEmail').value.trim();
      const role = document.getElementById('editUserRole').value;
      const course = parseInt(document.getElementById('editUserCourse').value);
      const days = parseInt(document.getElementById('editUserDays').value || '0');
      const coins = parseInt(document.getElementById('editUserCoins').value || '0');
      const streak = parseInt(document.getElementById('editUserStreak').value || '0');
      const status = document.getElementById('editUserStatus').value;

      if (!name || !email) return showToast('Name and email are required', 'error');

      // Update in AppState
      u.full_name = name;
      u.email = email;
      u.role = role;
      u.course_number = course;
      u.coins = coins;
      u.streak_days = streak;
      u.status = status;
      u.is_locked = status === 'blocked';

      // Update subscription days
      const newEndDate = new Date(Date.now() + days * 24 * 60 * 60 * 1000).toISOString();
      u.days_left = Math.max(0, days);
      u.is_premium = days > 0;
      u.plan = days > 0 ? 'Premium (' + days + 'd left)' : 'Expired';
      u.sub_end_date = newEndDate;

      closeModal();
      renderUsers(document.getElementById('mainContainer'));
      showToast('Saving changes and syncing to Supabase...', 'info');

      try {
        if (userId && (userId.length > 20 || userId.includes('-'))) {
          // 1. Update profiles in Supabase
          await sbPatch('profiles', userId, {
            name: name,
            role: role,
            status: status
          });

          // 2. Update subscriptions in Supabase
          const existing = await sbQuery('subscriptions', 'user_id=eq.' + userId);
          if (existing && existing.length > 0) {
            await sbPatch('subscriptions', existing[0].id, {
              status: days > 0 ? 'active' : 'expired',
              end_date: newEndDate,
              updated_at: new Date().toISOString()
            });
          } else {
            await sbInsert('subscriptions', {
              user_id: userId,
              status: days > 0 ? 'active' : 'expired',
              start_date: new Date().toISOString(),
              end_date: newEndDate
            });
          }
          showToast('✅ Student & subscription days updated in Supabase!', 'success');
        } else {
          showToast('Member updated locally.', 'success');
        }
        saveUsersToStorage();
      } catch(e) {
        showToast('Error syncing to Supabase: ' + e.message, 'error');
      }
    }
  
  </script>
